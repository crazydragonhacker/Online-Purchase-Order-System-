# Optional: spin up a free local MySQL instance for development.
# Usage:
#   docker compose up -d
#   docker compose exec mysql mysql -uroot -pchangeme < db/schema.sql
#
# This matches the values in .env.example — update both together if you
# change the password/db name.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: purchase_order
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
